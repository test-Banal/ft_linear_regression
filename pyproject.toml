[project]
name = "ft_linear_regression"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "test-Banal", email = "banal.privacy+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
]

[project.scripts]
ft_linear_regression = "ft_linear_regression:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

school = [
    "flake8>=7.3.0",
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
]

data = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.3",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
